# alembic.ini
# A minimal Alembic configuration file for OmniGraph OSINT project.
# This file is read by Alembic commands such as ``alembic upgrade head``.

[alembic]
# Path to migration scripts.
script_location = backend/alembic
# SQLAlchemy URL – will be overridden by the ``DATABASE_URL`` env var at runtime.
sqlalchemy.url = driver://user:pass@localhost/dbname

# Logging configuration (optional).
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %Y-%m-%d %H:%M:%S
